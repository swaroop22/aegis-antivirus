name: Release Aegis Defender Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Distribution Packages
        run: |
          mkdir -p dist
          # 1. Package macOS ZIP
          zip -r -q dist/Aegis-Defender-Pro-macOS.zip "Aegis Defender Pro.app" run.sh README.md assets

          # 2. Package macOS DMG
          mkdir -p /tmp/dmg_stage
          cp -R "Aegis Defender Pro.app" /tmp/dmg_stage/
          ln -s /Applications /tmp/dmg_stage/Applications
          hdiutil create -volname "Aegis Defender Pro" -srcfolder /tmp/dmg_stage -ov -format UDZO dist/Aegis-Defender-Pro-macOS.dmg
          rm -rf /tmp/dmg_stage

          # 3. Package Windows ZIP
          mkdir -p /tmp/win_stage
          cp -R server.py "Aegis Defender Pro.vbs" run.bat Create_Windows_Shortcut.ps1 build_windows_exe.py README.md ARCHITECTURE.md engine static data assets /tmp/win_stage/
          cd /tmp/win_stage && zip -r -q $GITHUB_WORKSPACE/dist/Aegis-Defender-Pro-Windows.zip .
          cd $GITHUB_WORKSPACE && rm -rf /tmp/win_stage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aegis Defender Pro ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name || 'v4.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🛡️ Aegis Defender Pro — Next-Gen Enterprise EDR & Antivirus

            Military-grade cross-platform antivirus for macOS and Windows.

            ### 📦 Download Links
            - 🍏 **macOS Installer:** `Aegis-Defender-Pro-macOS.dmg` (Apple Silicon & Intel)
            - 🍏 **macOS Portable:** `Aegis-Defender-Pro-macOS.zip`
            - 🪟 **Windows Bundle:** `Aegis-Defender-Pro-Windows.zip` (Windows 10 / 11)

            ### 🚀 Highlights
            - **Ransomware Canary Traps:** Decoy honeypots halt unauthorized encryption in < 5ms
            - **AI Threat Scorer:** Structural anomaly and entropy analysis for zero-day malware
            - **MITRE ATT&CK Hunter:** Audits LaunchDaemons & Registry Run keys against T1543/T1547
            - **Zero-Trust Socket Guard:** Live TCP/UDP socket auditor intercepts reverse shells
            - **HMAC Cryptographic Vault:** Sealed isolation with 3-pass DoD 5220.22-M shredding
          files: |
            dist/Aegis-Defender-Pro-macOS.dmg
            dist/Aegis-Defender-Pro-macOS.zip
            dist/Aegis-Defender-Pro-Windows.zip
