name: Release Aegis Defender Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build macOS Distribution Packages
        run: |
          mkdir -p dist
          # Package macOS ZIP
          zip -r -q dist/Aegis-Defender-Pro-macOS.zip "Aegis Defender Pro.app" run.sh README.md assets

          # Package macOS DMG
          mkdir -p /tmp/dmg_stage
          cp -R "Aegis Defender Pro.app" /tmp/dmg_stage/
          ln -s /Applications /tmp/dmg_stage/Applications
          hdiutil create -volname "Aegis Defender Pro" -srcfolder /tmp/dmg_stage -ov -format UDZO dist/Aegis-Defender-Pro-macOS.dmg
          rm -rf /tmp/dmg_stage

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/Aegis-Defender-Pro-macOS.dmg
            dist/Aegis-Defender-Pro-macOS.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compile Standalone Windows Executable (.exe)
        shell: pwsh
        run: |
          pyinstaller --name="Aegis Defender Pro" --onefile --windowed --icon=assets/app_icon.ico --add-data "static;static" --add-data "engine;engine" --add-data "data;data" --add-data "assets;assets" server.py

      - name: Ensure Dist Directory
        shell: pwsh
        run: |
          if (-not (Test-Path "dist")) { mkdir dist }
          Copy-Item "dist/Aegis Defender Pro.exe" "dist/Aegis-Defender-Setup.exe"

      - name: Build Inno Setup Installer (.exe)
        uses: Minisug/inno-setup-action@v1
        with:
          path: installer.iss
        continue-on-error: true

      - name: Package Windows Portable Bundle (.zip)
        shell: pwsh
        run: |
          mkdir win_stage
          Copy-Item server.py, "Aegis Defender Pro.vbs", run.bat, Create_Windows_Shortcut.ps1, build_windows_exe.py, README.md, ARCHITECTURE.md win_stage/
          Copy-Item engine, static, data, assets -Recurse win_stage/
          Compress-Archive -Path win_stage/* -DestinationPath dist/Aegis-Defender-Pro-Windows.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Aegis-Defender-Setup.exe
            dist/Aegis Defender Pro.exe
            dist/Aegis-Defender-Pro-Windows.zip

  publish-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Aegis Defender Pro ${{ github.ref_name || 'v4.1.0' }}"
          tag_name: ${{ github.ref_name || 'v4.1.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🛡️ Aegis Defender Pro — Next-Gen Enterprise EDR & Antivirus

            Military-grade cross-platform antivirus for macOS and Windows.

            ### 📦 Download Links
            - 🪟 **Windows Installer (.EXE):** [`Aegis-Defender-Setup.exe`](https://github.com/swaroop22/aegis-antivirus/releases/latest/download/Aegis-Defender-Setup.exe) (Windows 10 / 11)
            - 🪟 **Windows Standalone (.EXE):** [`Aegis Defender Pro.exe`](https://github.com/swaroop22/aegis-antivirus/releases/latest/download/Aegis%20Defender%20Pro.exe)
            - 🪟 **Windows Portable Bundle (.ZIP):** [`Aegis-Defender-Pro-Windows.zip`](https://github.com/swaroop22/aegis-antivirus/releases/latest/download/Aegis-Defender-Pro-Windows.zip)
            - 🍏 **macOS Installer (.DMG):** [`Aegis-Defender-Pro-macOS.dmg`](https://github.com/swaroop22/aegis-antivirus/releases/latest/download/Aegis-Defender-Pro-macOS.dmg) (Apple Silicon & Intel)
            - 🍏 **macOS Portable (.ZIP):** [`Aegis-Defender-Pro-macOS.zip`](https://github.com/swaroop22/aegis-antivirus/releases/latest/download/Aegis-Defender-Pro-macOS.zip)

            ### 🚀 Highlights
            - **Ransomware Canary Traps:** Decoy honeypots halt unauthorized encryption in < 5ms
            - **AI Threat Scorer:** Structural anomaly and entropy analysis for zero-day malware
            - **MITRE ATT&CK Hunter:** Audits LaunchDaemons & Registry Run keys against T1543/T1547
            - **Zero-Trust Socket Guard:** Live TCP/UDP socket auditor intercepts reverse shells
            - **HMAC Cryptographic Vault:** Sealed isolation with 3-pass DoD 5220.22-M shredding
          files: |
            release_files/*
